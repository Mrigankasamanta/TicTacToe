<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div class="result msg_container hide">
        <p id="msg">Winner</p>
        <div class="buttons new_buttons">
            <button id="newGame">New Game</button>
            <button id="show">Show game photo</button>
        </div>
    </div>
    <main>
        
        <div class="container">
            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
        <button id="restart">Reset Game</button>
    </main>
    <script src="script.js"></script>
</body>
</html>
